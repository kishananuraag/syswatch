<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>syswatch · dark dashboard</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">syswatch</div>
  <nav class="views" id="views" role="tablist" aria-label="screens">
    <button class="viewbtn active" data-view="overview" role="tab">Overview</button>
    <button class="viewbtn" data-view="cpu" role="tab">CPU</button>
    <button class="viewbtn" data-view="analytics" role="tab">Analytics</button>
    <button class="viewbtn" data-view="devices" role="tab">Devices</button>
    <button class="viewbtn" data-view="menubar" role="tab">Menubar</button>
    <button class="viewbtn" data-view="phone" role="tab">Phone</button>
    <button class="viewbtn" data-view="tv" role="tab">TV</button>
    <button class="viewbtn" data-view="tokens" role="tab">Tokens</button>
  </nav>
  <div class="topbar-right">
    <label class="range-wrap">Range
      <select id="rangeSelect">
        <option value="1m">1m</option>
        <option value="5m">5m</option>
        <option value="15m">15m</option>
        <option value="1h" selected>1h</option>
        <option value="6h">6h</option>
        <option value="1d">1d</option>
        <option value="7d">7d</option>
        <option value="30d">30d</option>
        <option value="1y">1y</option>
      </select>
    </label>
    <span id="live" class="live"><span class="dot"></span>live</span>
  </div>
</header>

<main class="stage">
  <section id="view-overview" class="view active"></section>
  <section id="view-cpu" class="view" hidden></section>
  <section id="view-analytics" class="view" hidden></section>
  <section id="view-devices" class="view" hidden></section>
  <section id="view-menubar" class="view" hidden></section>
  <section id="view-phone" class="view" hidden></section>
  <section id="view-tv" class="view" hidden></section>
  <section id="view-tokens" class="view" hidden></section>
</main>

<script src="/static/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
