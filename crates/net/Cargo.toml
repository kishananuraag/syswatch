[package]
name = "syswatch-net"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
syswatch-core = { path = "../core" }
iroh = "0.28"
iroh-net = "0.28"
iroh-base = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "2"
tokio = { version = "1", features = ["full"] }
thiserror = "2"

# T28 — pairing: X25519 ECDH + ChaCha20Poly1305.
# `ring` is already in the tree (via iroh/quinn); naming it here makes the
# ECDH/HKDF calls explicit rather than relying on a transitive re-export.
ring = "0.17"
chacha20poly1305 = "0.10"
zeroize = "1"