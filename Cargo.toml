[package]
name = "syswatch"
version = "0.2.0"
edition = "2024"

[dependencies]
sysinfo = "0.33"
crossterm = "0.28"
ratatui = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tray-icon = "0.4.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
open = "5.0"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[lib]
name = "syswatch"
path = "src/lib.rs"

[[bin]]
name = "syswatch"
path = "src/main.rs"

[[bin]]
name = "syswatch-tray"
path = "src/bin/tray.rs"
