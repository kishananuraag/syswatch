[package]
name = "syswatch"
version = "0.2.0"
edition = "2024"

[dependencies]
syswatch-core = { path = "crates/core" }
syswatch-store = { path = "crates/store" }
syswatch-sensors-macos = { path = "crates/sensors-macos" }
syswatch-net = { path = "crates/net" }
syswatch-agent = { path = "crates/agent" }
sysinfo = "0.33"
crossterm = "0.28"
ratatui = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tray-icon = "0.4.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
open = "5.0"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[lib]
name = "syswatch"
path = "src/lib.rs"

[[bin]]
name = "syswatch"
path = "src/main.rs"

[[bin]]
name = "syswatch-tray"
path = "src/bin/tray.rs"

# T19 — the root power/temperature daemon.  One binary replaces
# packaging/launchd/syswatch_power_sampler.sh (shell) + smc_temp (C helper):
# it spawns powermetrics, reads the AppleSMC through IOKit FFI, and writes
# sample.json atomically.  Installed by the dashboard's grant flow into
# /usr/local/libexec/syswatch/syswatch-powerd.
[[bin]]
name = "syswatch-powerd"
path = "src/bin/powerd.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"
